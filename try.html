<!DOCTYPE html>
<html>
<head >
<style>
table, th, td {
  border: 1px solid rgb(64, 51, 51);
  border-collapse: collapse;
  background-color:"tomato";
}

</style>
</head>
<body style="background-color: rgb(182, 237, 219);">

<h2  >Cell that spans five columns</h2>
<p color = "green">To make a cell span more than one column, use the colspan attribute.</p>

<table style="width:100%" >
  <tr>
    <th colspan="2">Nothing</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>43</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>57</td>
  </tr>
</table>
<img src=".jpg" alt="sabon">
</body>
</html>
